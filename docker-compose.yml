services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cog}
      POSTGRES_DB: ${POSTGRES_DB:-cog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cog} -d ${POSTGRES_DB:-cog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cog}:${POSTGRES_PASSWORD:-cog}@db:5432/${POSTGRES_DB:-cog}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cog}:${POSTGRES_PASSWORD:-cog}@db:5432/${POSTGRES_DB:-cog}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ORCHESTRATOR_TYPE: ${ORCHESTRATOR_TYPE:-langgraph}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"

volumes:
  pgdata:
